name: ✨ 새로운 기능
description: 새로운 기능을 개발합니다!
title: "[기능] "
type: "Feature"
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: ✨ 개요
      description: 추가하고 싶은 기능을 설명해 주세요.
      placeholder: 구체적으로 적을수록 좋습니다!
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: ✅ 해야할 일
      description: 이 기능을 구현하기 위해 필요한 작업을 작성해 주세요. 작업이 너무 많으면 여러 개의 이슈로 나누는 것을 추천합니다.
      placeholder: |
        - [ ] 로그인 기능 구현
        - [ ] 로그인 테스트 코드 작성
        - [ ] 로그인 API 문서화
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 📝 참고 사항
      description: 추가로 공유할 내용이 있다면 적어 주세요.
    validations:
      required: false
