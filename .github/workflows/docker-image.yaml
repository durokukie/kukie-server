# Dockerfile·빌드 스크립트가 바뀔 때만 실행
name: docker-image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - gradlew
      - gradlew.bat
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/docker-image.yaml
  push:
    branches: [develop]
    paths:
      - Dockerfile
      - .dockerignore
      - gradlew
      - gradlew.bat
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/docker-image.yaml

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t kukie-server:ci .
      - name: 이미지 안에 app.jar 가 있고 비루트(kukie)로 돈다
        run: docker run --rm --entrypoint sh kukie-server:ci -c 'ls -la /app/app.jar && test "$(id -un)" = kukie'
