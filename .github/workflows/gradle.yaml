# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  # develop 에 머지되고 build(테스트 포함)가 통과하면 개발환경 이미지를 구워 ECR kukie-server 에 올린다.
  # 출입증: kukie-infra 의 kukie-dev-github-member 역할 — 이 레포 develop 에서만 쓸 수 있어 main push 에서는 돌리지 않는다.
  # 레포 Variables 의 AWS_ROLE_ARN 이 그 역할이다. 태그는 다른 앱과 같이 dev-<커밋 SHA> 하나만 쓴다.
  # 버전은 kukie-manifest envs/dev/kustomization.yaml 의 digest 로 올린다 — 아래 요약에 나오는 값.
  # docker-image.yaml 은 경로 조건이 있어 소스만 바뀐 머지에서는 돌지 않으므로 여기에 둔다.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      REGISTRY: 320343233643.dkr.ecr.ap-northeast-2.amazonaws.com
      REPOSITORY: kukie-server
      TAG: dev-${{ github.sha }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    # Dockerfile 은 CI 가 만든 build/libs/app.jar 를 복사만 한다 — 잡이 달라 build 결과가 없으니 다시 만든다
    - run: ./gradlew bootJar
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ap-northeast-2
        allowed-account-ids: "320343233643"
    - name: Log in to ECR
      shell: bash
      run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
    # 창고가 MUTABLE 이라 같은 커밋으로 다시 돌리면 태그를 덮어써 digest 가 바뀐다. manifest 에 이미 옮겨 적은
    # digest 가 태그 없는 이미지가 되지 않게, 있으면 굽지 않고 그 digest 를 쓴다.
    # 역할에 ecr:DescribeImages 가 없어서 BatchGetImage 로 확인한다. 받는 매니페스트 종류를 명시해야
    # buildx · attestation 으로 OCI image index 가 올라가도 "태그 없음" 으로 오판하지 않는다.
    - name: Build and push unless this commit is already in ECR
      shell: bash
      run: |
        digest() {
          aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" \
            --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.oci.image.manifest.v1+json \
              application/vnd.docker.distribution.manifest.list.v2+json application/vnd.docker.distribution.manifest.v2+json \
            --query 'images[0].imageId.imageDigest' --output text
        }
        existing=$(digest)
        if [ "$existing" = "None" ]; then
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -t "$REGISTRY/$REPOSITORY:$TAG" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          # ECR 은 push 직후 조회가 늦게 보일 수 있다 — 간격을 늘려 가며 다시 본다 (push 뒤 0·2·6·14·30초, 최대 30초)
          for wait in 0 2 4 8 16; do
            sleep "$wait"
            existing=$(digest)
            [ "$existing" != "None" ] && break
          done
        else
          echo "이미 있는 태그 — 굽지 않는다"
        fi
        # 요약의 digest 는 사람이 manifest 에 옮겨 적는 값이다 — 모양이 아니면 잡을 실패시킨다
        case "$existing" in
          sha256:*) ;;
          *) echo "digest 를 읽지 못했다: $existing" >&2; exit 1 ;;
        esac
        echo "### $REPOSITORY 이미지" >> "$GITHUB_STEP_SUMMARY"
        echo "- 태그: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- digest: \`$existing\` — kukie-manifest envs/dev 의 kukie-server 줄에 넣는 값" >> "$GITHUB_STEP_SUMMARY"

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
