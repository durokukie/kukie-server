spring:
  application:
    name: kukie
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail 기본 타임아웃은 사실상 무한이라 상한을 둔다
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 30d

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

auth:
  cookie:
    # https 에서만 쿠키가 실린다. 로컬 http 개발에서만 false (AuthCookieProperties)
    secure: ${AUTH_COOKIE_SECURE:true}
