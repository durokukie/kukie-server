spring:
  application:
    name: kukie
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 타임아웃이 없으면 JavaMail 기본값은 사실상 무한이다. 메일 서버가 멈추면 발송 스레드가
          # 영영 매달려 있게 되므로 상한을 둔다 (자동 리뷰 지적).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 30d

# 제공자마다 두 쌍 — 데스크톱(앱 루프백)과 웹(/auth/callback). 웹 쌍이 비어 있으면 웹 로그인만 503 이고 앱은 그대로 된다 (OAuthProperties)
oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    web-client-id: ${GITHUB_WEB_CLIENT_ID}
    web-client-secret: ${GITHUB_WEB_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}
    web-client-secret: ${GOOGLE_WEB_CLIENT_SECRET}

auth:
  cookie:
    # https 에서만 쿠키가 실린다. 로컬 http 개발에서만 false (AuthCookieProperties)
    secure: ${AUTH_COOKIE_SECURE:true}
