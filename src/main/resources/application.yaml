spring:
  application:
    name: kukie
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 30d

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

auth:
  cookie:
    # https 에서만 쿠키가 실린다. 로컬 http 개발에서만 false (AuthCookieProperties)
    secure: ${AUTH_COOKIE_SECURE:true}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  ses:
    from: Kukie <noreply@durokukie.com>

# 메일 버튼이 여는 웹 주소
web-app:
  url: ${WEB_APP_URL}
