<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  초대 안내 메일.

  팀 이름과 초대한 사람 이름은 사용자가 지은 값이다. Thymeleaf 의 인라인 출력은 기본이 이스케이프라
  마크업을 넣어도 글자로만 보인다. 날것으로 내보내려면 대괄호-소괄호 형태를 일부러 써야 하므로,
  실수로 뚫릴 일이 없다 — 본문을 문자열로 조립하던 방식을 이 때문에 그만뒀다.

  이 주석은 렌더링 결과에 남지 않는다 (Thymeleaf 파서 수준 주석).
*/-->
<body>
<h1>[[${teamName}]] 팀 초대</h1>
<p>[[${inviterName}]]님이 회원님을 [[${teamName}]] 팀에 초대했습니다.</p>
<p>Kukie 에 가입하면 받은 초대함에서 초대를 수락할 수 있습니다.</p>
<p>※ 초대는 [[${expirationDays}]]일 동안만 유효합니다.</p>
</body>
</html>
